<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUVIA | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <div class="container py-5">

        <div class="login-card">

            <div class="row g-0 al">

                <!-- LEFT SIDE -->

                <div class="col-lg-5">

                    <div class="login-left">

                        <h2>

                            Join LUVIA

                            <br>

                            Create Your Style

                        </h2>

                        <p>

                            Create your account and customize your fashion.

                        </p>

                    </div>

                </div>

                <!-- RIGHT SIDE -->

                <div class="col-lg-7">

                    <div class="login-right">

                        <div class="text-center mb-4">

                            <div class="nav-logo justify-content-center">
                                <img src="../../images/logo.png" class="img-fluid rounded-circle me-2" alt="Logo"
                                    style="width:70px; height:70px; object-fit:cover;">

                                <div>
                                    <h1 class="m-0">LUVIA</h1>

                                </div>
                            </div>

                        </div>

                        <ul class="nav nav-tabs justify-content-center mb-4">

                            <li class="nav-item">

                                <a class="nav-link" href="../login/login.html">

                                    Login

                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link active" href="../register/register.html">

                                    Register

                                </a>

                            </li>

                        </ul>

                        <h2 class="fw-bold">

                            Create Account

                        </h2>

                        <form action="http://localhost/LUVIA/php/register.php" method="POST">
                            <p class="text-muted mb-4">

                                Fill in your details to create your account.

                            </p>

                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" name="full_name"
                                    placeholder="Enter your full name" required>
                            </div>

                            <!-- EMAIL -->

                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" name="email" placeholder="Enter your email"
                                    required>
                            </div>

                            <!-- PHONE -->

                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" name="phone"
                                    placeholder="Enter your phone number" required>
                            </div>

                            <!-- PASSWORD -->

                            <div class="mb-3">
                                <label class="form-label">Password</label>

                                <div>

                                    <input type="password" class="form-control" name="password"
                                        placeholder="Create password" required>

                                    <span class="input-group-text">

                                    </span>

                                </div>

                            </div>

                            <!-- CONFIRM PASSWORD -->

                            <div class="mb-3">
                                <label class="form-label">Address</label>

                                <textarea class="form-control" name="address" placeholder="Enter your address"
                                    required></textarea>
                            </div>

                            <!-- TERMS -->

                            <div class="form-check mb-4">

                                <input class="form-check-input" type="checkbox" id="terms">

                                <label class="form-check-label" for="terms">

                                    I agree to the
                                    <a href="#">Terms & Conditions</a>

                                </label>

                            </div>

                            <!-- REGISTER BUTTON -->

                            <button type="submit" name="register" class="btn login-btn w-100">

                                Create Account

                            </button>

                            <div class="text-center my-4">

                                or continue with

                            </div>

                            <!-- SOCIAL LOGIN -->

                            <div class="row">

                                <div class="col-6">

                                    <button class="btn btn-outline-danger social-btn w-100">

                                        <i class="fa-brands fa-google"></i>

                                        Google

                                    </button>

                                </div>

                                <div class="col-6">

                                    <button class="btn btn-outline-primary social-btn w-100">

                                        <i class="fa-brands fa-facebook-f"></i>

                                        Facebook

                                    </button>

                                </div>

                            </div>

                            <div class="text-center mt-4">

                                Already have an account?

                                <a href="../login/login.html" class="fw-bold text-decoration-none">

                                    Login

                                </a>

                        </form>

                    </div>

                </div>
            </div>
        </div>
    </div>
    </div>

</body>

</html>
